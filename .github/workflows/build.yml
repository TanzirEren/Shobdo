name: Build Shobdo APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      general_model:
        description: "General speech model (English, Hindi, Urdu, Arabic and others)"
        default: "small-q5_1"
        type: choice
        options: [ "base-q5_1", "small-q5_1", "medium-q5_0" ]
      bangla_model:
        description: "Bangla fine-tuned model (Hugging Face repo, converted automatically). Type none to skip."
        default: "bangla-speech-processing/BanglaASR"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Android SDK / NDK / CMake
        run: echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Fetch whisper.cpp (C++ speech engine)
        run: git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp

      - name: General speech model (Python)
        run: python tools/fetch_model.py "${{ github.event.inputs.general_model || 'small-q5_1' }}"

      - name: Bangla speech model (Python, convert + quantise)
        env:
          BN_REPO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bangla_model || 'bangla-speech-processing/BanglaASR' }}
        run: |
          if [ "$BN_REPO" != "none" ] && [ -n "$BN_REPO" ]; then
            python tools/build_bangla_model.py "$BN_REPO" || echo "::warning::Bangla model could not be built. The APK will still build, but Bangla accuracy will be poor."
          else
            echo "Bangla model skipped"
          fi

      - name: Show bundled models
        run: ls -la app/src/main/assets/models/

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Shobdo-APK
          path: app/build/outputs/apk/release/*.apk
