plugins { id 'com.android.application' }

android {
    namespace 'com.tanzirdev.shobdo'
    compileSdk 34
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.tanzirdev.shobdo'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release' }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // installable APK without your own keystore
        }
    }
    aaptOptions { noCompress 'bin' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-transformer:1.3.1'
    implementation 'androidx.media3:media3-effect:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'com.google.guava:guava:33.0.0-android'
}
